[gamevals.controller]
hunter_trap = 2
# Falconry gets its own controller type rather than reusing `hunter_trap`: `onAiConTimer` dispatches
# on the type, and a falcon arriving at the trap tick would be read as a trap with a corrupt family.
hunter_falcon = 3

[gamevals.varcon]
hunter_trap_owner = 4
hunter_trap_family = 5
hunter_trap_creature = 6
# Deadfall consumes a log to arm, and dismantling gives it back, so the controller has to remember
# which one went in.
hunter_trap_deadfall_log = 7
# The falcon's two, kept separate from the trap's rather than shared. They live on a different
# controller type and mean a different thing - `hunter_falcon_creature` indexes
# `FalconryCreatures.all`, not `HunterCreatures.all` - and sharing a name across two controller types
# would make a varcon rename in one feature silently retarget the other.
hunter_falcon_owner = 8
hunter_falcon_creature = 9

[gamevals.content]
hunter_bird_snare = 54
hunter_box_trap = 55
# One group for every op-carrying deadfall boulder state; the transient setting/trapping/failing
# frames carry no ops and so need no group.
hunter_deadfall = 56
# Both net trap locs share one group: the young tree and the "Net trap" loc beside it are two halves
# of one trap, and every op either can carry is dispatched by the same handler.
hunter_net_trap = 57
hunter_magic_box = 58
# One group for all nine crab-trap lifecycle locs. They are `multiloc` children of the twenty
# map-placed site locs, and `LocInteractions.opTrigger` resolves the child before it looks for a
# handler, so the group belongs on the children - the sites themselves carry no ops at all.
hunter_crab_trap = 59
# One group for all 28 bird house lifecycle locs - the bare space and nine tiers x three states.
# They are `multiloc` children of the four map-placed spaces, so the group belongs on the children
# for the reason the crab trap's does. One group rather than four because the op *indices* are
# consistent across the states: op1 Build/Interact, op2 Seeds, op3 Dismantle/Empty, op4 Reset.
hunter_bird_house = 60

# The falconry enclosure, whose exit strips the rented glove. 58 is the next free id above the packed
# area run's low block, which ends at runecrafting's `rune_essence_mine = 57`; the high block starts
# at 32757. The polygon lives in `.data/raw-cache/map/area/piscatoris_falconry.toml` - an area name
# resolves to an id without it and then matches no tile, which is the silent half of the two-
# declaration rule.
[gamevals.area]
piscatoris_falconry = 58

# A baited crab trap fills on a fixed timer rather than on a roll, and its owner is expected to walk
# to the next trap while it does, so the wait is a soft queue on the player rather than a controller
# on the tile: nothing about a crab trap lives in the world, and a controller anchored on a shared
# hole would collide between two players whose traps are private varbit state. 60 is the next free
# queue id - the packed table ends at `fullscreen_map = 26` and the module block runs 40-59 with 48
# and 57 unused.
[gamevals.queue]
hunter_crab_catch = 60

# A bird house fills on wall-clock time rather than on ticks, so the queue is only the in-session
# half of the timer: the deadline lives in `hunter_birdhouse_ready_*` and the queue is re-armed
# against it at login. Soft, and on the player, for the same reason the crab catch is - the whole
# loop is to seed a house and walk to the next one, and a house maturing must not interrupt
# whatever its owner is doing fifty minutes later.
hunter_birdhouse_fill = 61

# The trap cap is stored as up to five packed trap coords rather than a counter, so that a trap
# lost while its owner is away (collapse, logout, restart) never permanently costs a slot. Custom
# varp ids grow downward from the low-water mark of the server-authored block (65502); the block
# 65481-65501 is already claimed by runecrafting, sandstorm, slayer, instances, herblore and
# prayer, so hunter takes the next five below it. (65502 is not, as an earlier version of this
# comment claimed, the packed cache's own floor: `max-ids.toml` puts the packed varp table at
# 0..5725, and `varp.rscm` already runs *above* 65535 for slayer's kill counts. The descent is a
# convention with a lot of headroom, not a boundary.)
[gamevals.varp]
hunter_trap_coord_1 = 65480
hunter_trap_coord_2 = 65479
hunter_trap_coord_3 = 65478
hunter_trap_coord_4 = 65477
hunter_trap_coord_5 = 65476

# Bird houses. The four spaces render from packed varps (1626-1629, `Perm`), so the tier and the
# state need nothing authored; these eight carry the two things that varp has no room for.
#
# `_ready_*` is the epoch minute the space's house finishes filling. Wall clock rather than ticks
# because the fill has to elapse while its owner is logged out, which no queue or controller can
# do. This is `RuneTime.epochMinute()`'s first caller in the repo.
#
# `_seeds_*` is how many of the ten seed units a space has taken so far. It needs its own var
# because partial progress is invisible to the client - a tier has only three states - and
# refusing anything short of a full fill would strand a player holding six seeds.
hunter_birdhouse_ready_1 = 65475
hunter_birdhouse_ready_2 = 65474
hunter_birdhouse_ready_3 = 65473
hunter_birdhouse_ready_4 = 65472
hunter_birdhouse_seeds_1 = 65471
hunter_birdhouse_seeds_2 = 65470
hunter_birdhouse_seeds_3 = 65469
hunter_birdhouse_seeds_4 = 65468

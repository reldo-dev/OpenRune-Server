[gamevals.dbtable]
# 55543-55549 sit above the whole 555xx dbtable run in use today - mining's 55520 and firemaking's
# 55535-55537 - with 55538-55542 left clear for the fletching tables.
hunter_snare_creatures = 55543
hunter_box_creatures = 55544
hunter_deadfall_creatures = 55545
hunter_nettrap_creatures = 55546
hunter_magicbox_creatures = 55547
hunter_falconry_creatures = 55548
hunter_butterfly_creatures = 55549

# Append-only block, clear of the 555xx and 56[0-2]xx dbrow runs with headroom. Ids ascend in the
# order the creatures appear in the combined list, which a sprung trap persists an index into, so
# each technique takes the next free decade rather than filling the gap above it.
[gamevals.dbrow]
hunter_jungle_bird = 56300
hunter_desert_bird = 56301
hunter_woodland_bird = 56302
hunter_polar_bird = 56303
hunter_chinchompa = 56304
hunter_carnivorous_chinchompa = 56305
hunter_black_chinchompa = 56306
hunter_wild_kebbit = 56310
hunter_barbtailed_kebbit = 56311
hunter_prickly_kebbit = 56312
hunter_sabretoothed_kebbit = 56313
hunter_pyre_fox = 56314
hunter_swamp_lizard = 56320
hunter_orange_salamander = 56321
hunter_red_salamander = 56322
hunter_black_salamander = 56323
hunter_tecu_salamander = 56324
hunter_imp = 56330
# Never indexed into `HunterCreatures.all`, but the next free decade keeps one ascending run.
hunter_spotted_kebbit = 56340
hunter_dark_kebbit = 56341
hunter_dashing_kebbit = 56342
# Butterfly netting, which is not a trap either - its rows are read into `ButterflyCreatures.all`.
hunter_ruby_harvest = 56350
hunter_sapphire_glacialis = 56351
hunter_snowy_knight = 56352
hunter_black_warlock = 56353
hunter_sunlight_moth = 56354
# The closers join already-shipped tables, so their ids sit above every id in use anywhere in the
# hunter block - not merely their own table's (docs/hunter.md).
hunter_tropical_wagtail = 56360
hunter_ferret = 56361
hunter_embertailed_jerboa = 56362

[gamevals.controller]
hunter_trap = 2
# Its own controller type: a falcon arriving at the trap tick would read as a corrupt trap.
hunter_falcon = 3

[gamevals.varcon]
hunter_trap_owner = 4
hunter_trap_family = 5
hunter_trap_creature = 6
# Deadfall consumes a log to arm, and dismantling gives it back, so the controller has to remember
# which one went in.
hunter_trap_deadfall_log = 7
# Kept separate from the trap's varcons: sharing a name across controller types would let a rename
# in one feature silently retarget the other.
hunter_falcon_owner = 8
hunter_falcon_creature = 9

[gamevals.content]
hunter_bird_snare = 54
hunter_box_trap = 55
# One group for every op-carrying deadfall boulder state; the transient setting/trapping/failing
# frames carry no ops and so need no group.
hunter_deadfall = 56
# Both net trap locs share one group: the young tree and the "Net trap" loc beside it are two halves
# of one trap, and every op either can carry is dispatched by the same handler.
hunter_net_trap = 57
hunter_magic_box = 58

# 59 is the next free id above fishing's `fishing_guild = 58`. The polygon must also exist in
# `.data/raw-cache/map/area/` - a name without it resolves and then matches no tile.
[gamevals.area]
piscatoris_falconry = 59

# Custom varp ids grow downward from the low-water mark of the server-authored block: 65481-65501
# is already claimed by runecrafting, sandstorm, slayer, instances, herblore and prayer, so hunter
# takes the next five below it. Coords rather than a counter: see docs/hunter.md.
[gamevals.varp]
hunter_trap_coord_1 = 65480
hunter_trap_coord_2 = 65479
hunter_trap_coord_3 = 65478
hunter_trap_coord_4 = 65477
hunter_trap_coord_5 = 65476
